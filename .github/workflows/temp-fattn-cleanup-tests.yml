name: Temporary fattn wave64 cleanup

on:
  push:
    branches:
      - feature_change_to_warp_size64
    paths:
      - .github/workflows/temp-fattn-cleanup-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature_change_to_warp_size64
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/temp-fattn-cleanup.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/temp-fattn-cleanup.py .github/workflows/temp-fattn-cleanup-tests.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ggml/src/ggml-cuda/fattn-vec.cuh ggml/src/ggml-cuda/fattn-common.cuh tests/test-backend-ops.cpp .github/temp-fattn-cleanup.py .github/workflows/temp-fattn-cleanup-tests.yml
          git commit -m 'hip: clean up wave64 fattn tail experiment'
          git push origin HEAD:feature_change_to_warp_size64
