name: Temporary fattn vec tail patch

on:
  push:
    branches:
      - feature_change_to_warp_size64
    paths:
      - .github/workflows/temp-fattn-vec-tail.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature_change_to_warp_size64
          fetch-depth: 0

      - name: Add GCN D256 Q8 vector tail support
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ggml/src/ggml-cuda/fattn.cu')
          text = path.read_text()
          old = '''    const bool can_use_vector_kernel = Q->ne[0] <= 256 && Q->ne[0] % 64 == 0 && Q->ne[0] != 192 && K->ne[1] % FATTN_KQ_STRIDE == 0;\n'''
          new = '''#if defined(GGML_USE_HIP)\n    const bool can_use_gcn_vec_tail = GGML_CUDA_CC_IS_GCN(cc) && Q->ne[0] == 256 && Q->ne[1] == 1 &&\n        K->type == GGML_TYPE_Q8_0 && V->type == GGML_TYPE_Q8_0 && K->ne[1] >= FATTN_KQ_STRIDE;\n#else\n    constexpr bool can_use_gcn_vec_tail = false;\n#endif // defined(GGML_USE_HIP)\n    const bool can_use_vector_kernel = Q->ne[0] <= 256 && Q->ne[0] % 64 == 0 && Q->ne[0] != 192 &&\n        (K->ne[1] % FATTN_KQ_STRIDE == 0 || can_use_gcn_vec_tail);\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))

          path = Path('ggml/src/ggml-cuda/fattn-vec.cuh')
          text = path.read_text()

          old = '''    constexpr int nthreads    = ggml_cuda_fattn_vec_get_nthreads_device();\n    constexpr int warp_size   = ggml_cuda_fattn_vec_get_warp_size_device();\n    constexpr int nthreads_KQ = (type_K == GGML_TYPE_F16 || type_K == GGML_TYPE_BF16) ? 128 / cpy_nb : nthreads_KQ_q;\n    constexpr int nthreads_V  = (type_V == GGML_TYPE_F16 || type_V == GGML_TYPE_BF16) ? 128 / cpy_nb : nthreads_V_q;\n\n'''
          new = '''    constexpr int nthreads    = ggml_cuda_fattn_vec_get_nthreads_device();\n    constexpr int warp_size   = ggml_cuda_fattn_vec_get_warp_size_device();\n    constexpr int nthreads_KQ = (type_K == GGML_TYPE_F16 || type_K == GGML_TYPE_BF16) ? 128 / cpy_nb : nthreads_KQ_q;\n    constexpr int nthreads_V  = (type_V == GGML_TYPE_F16 || type_V == GGML_TYPE_BF16) ? 128 / cpy_nb : nthreads_V_q;\n#if defined(GGML_USE_HIP) && defined(GCN)\n    constexpr bool allow_kv_tail = D == 256 && ncols == 1 && type_K == GGML_TYPE_Q8_0 && type_V == GGML_TYPE_Q8_0;\n#else\n    constexpr bool allow_kv_tail = false;\n#endif // defined(GGML_USE_HIP) && defined(GCN)\n\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    for (int k_VKQ_0 = blockIdx.y*nthreads; k_VKQ_0 < k_VKQ_max; k_VKQ_0 += gridDim.y*nthreads,\n             // Increment pointers after each loop:\n             K += gridDim.y*nthreads*nb11, V += gridDim.y*nthreads*nb21, maskh += gridDim.y*nthreads) {\n\n        // Calculate KQ tile and keep track of new maximum KQ values:\n'''
          new = '''    for (int k_VKQ_0 = blockIdx.y*nthreads; k_VKQ_0 < k_VKQ_max; k_VKQ_0 += gridDim.y*nthreads,\n             // Increment pointers after each loop:\n             K += gridDim.y*nthreads*nb11, V += gridDim.y*nthreads*nb21, maskh += gridDim.y*nthreads) {\n\n        const bool full_kv_tile = k_VKQ_0 + nthreads <= k_VKQ_max;\n\n        // Calculate KQ tile and keep track of new maximum KQ values:\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''            for (int j = 0; j < ncols; ++j) {\n                float sum = vec_dot_KQ(K + i_KQ*nb11, Q_reg[j], Q_i32[j], Q_ds[j]);\n                sum = warp_reduce_sum<nthreads_KQ>(sum);\n\n                if (use_logit_softcap) {\n                    sum = logit_softcap*tanhf(sum);\n                }\n\n                if (mask && (ncols == 1 || ic0 + j < int(ne01.z))) {\n                    sum += slope*__half2float(maskh[j*ne11 + i_KQ]);\n                }\n\n                KQ_max_new[j] = fmaxf(KQ_max_new[j], sum + FATTN_KQ_MAX_OFFSET);\n'''
          new = '''            for (int j = 0; j < ncols; ++j) {\n                const bool valid_KQ = !allow_kv_tail || full_kv_tile || k_VKQ_0 + i_KQ < k_VKQ_max;\n                float sum = valid_KQ ? vec_dot_KQ(K + i_KQ*nb11, Q_reg[j], Q_i32[j], Q_ds[j]) : 0.0f;\n                sum = warp_reduce_sum<nthreads_KQ>(sum);\n\n                if (valid_KQ) {\n                    if (use_logit_softcap) {\n                        sum = logit_softcap*tanhf(sum);\n                    }\n\n                    if (mask && (ncols == 1 || ic0 + j < int(ne01.z))) {\n                        sum += slope*__half2float(maskh[j*ne11 + i_KQ]);\n                    }\n                } else {\n                    sum = -FLT_MAX/2.0f;\n                }\n\n                KQ_max_new[j] = fmaxf(KQ_max_new[j], sum + FATTN_KQ_MAX_OFFSET);\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''        for (int k0 = 0; k0 < warp_size; k0 += V_cols_per_iter) {\n            const int k = threadIdx.y*warp_size + k0 + (nthreads_V == warp_size ? 0 : threadIdx.x / nthreads_V);\n\n#ifdef V_DOT2_F32_F16_AVAILABLE\n'''
          new = '''        for (int k0 = 0; k0 < warp_size; k0 += V_cols_per_iter) {\n            const int k = threadIdx.y*warp_size + k0 + (nthreads_V == warp_size ? 0 : threadIdx.x / nthreads_V);\n\n            if constexpr (allow_kv_tail) {\n                if (!full_kv_tile && k_VKQ_0 + k >= k_VKQ_max) {\n                    continue;\n                }\n            }\n\n#ifdef V_DOT2_F32_F16_AVAILABLE\n'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY

      - name: Validate patch
        run: |
          git diff --check
          git diff -- ggml/src/ggml-cuda/fattn.cu ggml/src/ggml-cuda/fattn-vec.cuh

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-fattn-vec-tail.yml
          git add ggml/src/ggml-cuda/fattn.cu ggml/src/ggml-cuda/fattn-vec.cuh
          git commit -m "hip: allow GCN D256 Q8 fattn vec KV tails"
          git push origin HEAD:feature_change_to_warp_size64
