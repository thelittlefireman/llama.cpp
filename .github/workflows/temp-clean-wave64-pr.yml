name: Temporary clean wave64 PR branch

on:
  push:
    branches:
      - tmp-clean-wave64-pr-run3
    paths:
      - .github/workflows/temp-clean-wave64-pr.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unrelated diff from wave64 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master feature_change_to_warp_size64_master
          git checkout -B feature_change_to_warp_size64_master origin/feature_change_to_warp_size64_master
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ggml/src/ggml-cuda/fattn-vec.cuh')
          s = p.read_text()
          s = s.replace('static int ggml_cuda_fattn_vec_get_nthreads_host(const int cc) {\n    GGML_UNUSED(cc);\n    return 128;\n}',
                        'static int ggml_cuda_fattn_vec_get_nthreads_host(const int cc) {\n    return 128;\n    GGML_UNUSED(cc);\n}')
          s = s.replace('#ifndef GGML_USE_HIP\n        __syncwarp();\n#endif // GGML_USE_HIP', '        ggml_cuda_syncwarp();')
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "ggml/src/ggml-cuda/fattn-vec.cuh"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ggml/src/ggml-cuda/fattn-vec.cuh
          git commit --amend --no-edit
          git push --force origin HEAD:feature_change_to_warp_size64_master
