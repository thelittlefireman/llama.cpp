name: Temporary clean wave64 PR branch

on:
  push:
    branches:
      - tmp-clean-wave64-pr-run3
    paths:
      - .github/workflows/temp-clean-wave64-pr.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve wave32 codegen paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master feature_change_to_warp_size64_master
          git show origin/feature_change_to_warp_size64_master:ggml/src/ggml-cuda/fattn-vec.cuh > /tmp/fattn-vec.cuh
          git checkout -B feature_change_to_warp_size64_master origin/master
          python3 - <<'PY'
          from pathlib import Path

          p = Path('/tmp/fattn-vec.cuh')
          s = p.read_text()

          old = '''#pragma unroll
                for (int i0 = 0; i0 < int(D/sizeof(int)); i0 += nthreads_quantize) {
#if defined(GGML_USE_HIP) && defined(GCN)
                    const bool quantize_lane_active = nthreads_quantize > WARP_SIZE || threadIdx.x < WARP_SIZE;
#else
                    constexpr bool quantize_lane_active = true;
#endif // defined(GGML_USE_HIP) && defined(GCN)
                    if (quantize_lane_active) {
                        quantize_q8_1_to_shared<float2, nthreads_quantize>
                            (Q_f + i0*sizeof(int), scale, tmp_q_i32 + i0, tmp_q_ds + i0/QI8_1);
                    }
                }
'''
          new = '''#pragma unroll
                for (int i0 = 0; i0 < int(D/sizeof(int)); i0 += nthreads_quantize) {
                    if constexpr (warp_size > WARP_SIZE && nthreads_quantize <= WARP_SIZE) {
                        if (threadIdx.x < WARP_SIZE) {
                            quantize_q8_1_to_shared<float2, nthreads_quantize>
                                (Q_f + i0*sizeof(int), scale, tmp_q_i32 + i0, tmp_q_ds + i0/QI8_1);
                        }
                    } else {
                        quantize_q8_1_to_shared<float2, nthreads_quantize>
                            (Q_f + i0*sizeof(int), scale, tmp_q_i32 + i0, tmp_q_ds + i0/QI8_1);
                    }
                }
'''
          if old not in s:
              raise SystemExit('quantize block not found')
          s = s.replace(old, new, 1)
          s = s.replace('const int i = i0 + threadIdx.x % nthreads_KQ;',
                        'const int i = i0 + (nthreads_KQ == warp_size ? threadIdx.x : threadIdx.x % nthreads_KQ);', 1)
          s = s.replace('const int i = i0 + (threadIdx.x % nthreads_KQ)*cpy_ne;',
                        'const int i = i0 + (nthreads_KQ == warp_size ? threadIdx.x : threadIdx.x % nthreads_KQ)*cpy_ne;', 2)

          Path('ggml/src/ggml-cuda/fattn-vec.cuh').write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "ggml/src/ggml-cuda/fattn-vec.cuh"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ggml/src/ggml-cuda/fattn-vec.cuh
          git commit -m 'ggml-cuda: hip use wave64 for GCN Q8 flash attention vec'
          git push --force origin HEAD:feature_change_to_warp_size64_master
