name: Temporary fattn vec tail v2 patch

on:
  push:
    branches:
      - feature_change_to_warp_size64
    paths:
      - .github/workflows/temp-fattn-vec-tail-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature_change_to_warp_size64
          fetch-depth: 0
      - name: Build isolated tail specialization
        run: python3 .github/scripts/temp_fattn_vec_tail_v2.py
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -n "bool oob_check" ggml/src/ggml-cuda/fattn-vec.cuh
          grep -n "can_use_gcn_vec_tail" ggml/src/ggml-cuda/fattn.cu
          if grep -q "allow_kv_tail" ggml/src/ggml-cuda/fattn-vec.cuh; then exit 1; fi
          git diff --stat
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-fattn-vec-tail-v2.yml .github/scripts/temp_fattn_vec_tail_v2.py
          git add ggml/src/ggml-cuda/fattn-vec.cuh ggml/src/ggml-cuda/fattn.cu
          git commit -m "hip: isolate GCN fattn vec KV tail path"
          git push origin HEAD:feature_change_to_warp_size64
