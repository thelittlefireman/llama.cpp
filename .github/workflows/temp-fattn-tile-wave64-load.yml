name: Temporary fattn tile wave64 loader patch

on:
  push:
    branches:
      - feature_change_to_warp_size64

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature_change_to_warp_size64
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/temp-fattn-tile-wave64-load.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "hip: use physical wave64 for GCN fattn tile KV loads"
          git push origin HEAD:feature_change_to_warp_size64
