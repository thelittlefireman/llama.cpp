name: Temporary add mid long fattn tests
on:
  push:
    branches: [feature_change_to_warp_size64]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature_change_to_warp_size64
      - name: Add 8k 16k 32k tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test-backend-ops.cpp')
          text = path.read_text()
          anchor = '    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1},  4096, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n'
          insert = anchor + '    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1},  8192, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1}, 16384, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1}, 32768, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n'
          assert text.count(anchor) == 1
          assert '},  8192, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));' not in text
          path.write_text(text.replace(anchor, insert))
          PY
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test-backend-ops.cpp
          git rm .github/workflows/temp-add-mid-long-fattn-tests.yml
          git commit -m 'test: add 8k 16k 32k fattn vec cases'
          git push origin HEAD:feature_change_to_warp_size64
