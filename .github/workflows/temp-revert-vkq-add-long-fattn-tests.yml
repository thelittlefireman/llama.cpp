name: Temporary revert VKQ64 and add long fattn tests

on:
  push:
    branches:
      - feature_change_to_warp_size64

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature_change_to_warp_size64
          fetch-depth: 0
      - name: Restore pre-VKQ64 fattn tile
        run: git show 831a2f4a77e459e69cdbda36dd859d1836530511:ggml/src/ggml-cuda/fattn-tile.cuh > ggml/src/ggml-cuda/fattn-tile.cuh
      - name: Add long-context fattn vec tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test-backend-ops.cpp')
          text = path.read_text()
          anchor = '    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1},  4096, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n'
          added = (
              '    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1}, 65536, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n'
              '    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1}, 131072, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n'
              '    test_cases.emplace_back(new test_flash_attn_ext(256, 256, 2, {16, 1}, 262144, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0, GGML_TYPE_Q8_0));\n'
          )
          assert text.count(anchor) == 1
          assert ' 65536, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0' not in text
          assert ' 131072, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0' not in text
          assert ' 262144, 1, true, false, 0, 0, GGML_PREC_F32, GGML_TYPE_Q8_0' not in text
          path.write_text(text.replace(anchor, anchor + added))
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/temp-revert-vkq-add-long-fattn-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "hip: revert wave64 VKQ hot loop and add long fattn vec tests"
          git push origin HEAD:feature_change_to_warp_size64
