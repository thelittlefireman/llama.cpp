name: gfx906 FlashAttention interleave ISA

on:
  push:
    branches: [diagnostic_gfx906_fma_isa_20261018]

permissions:
  contents: read

jobs:
  isa:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    container: rocm/dev-ubuntu-22.04:7.2.1
    steps:
      - name: Checkout FlashAttention interleave test
        uses: actions/checkout@v4
        with:
          repository: thelittlefireman/llama.cpp
          ref: 83c326f1e4f80b71fabacfe8847f44f2366d348b
          persist-credentials: false

      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build hipblas-dev rocblas-dev libssl-dev python3 binutils
          hipconfig --version

      - name: Build gfx906 saved assembly
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS=gfx906 -DGGML_HIP=ON -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DCMAKE_HIP_FLAGS='-save-temps -Rpass-analysis=kernel-resource-usage'
          cmake --build build --target ggml-hip -j 2 2>&1 | tee interleave-build.log

      - name: Pack all gfx906 saved ISA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tarfile
          paths = sorted(Path('build').rglob('*gfx906*.s'))
          assert len(paths) == 146, f'Expected 146 gfx906 ISA files, found {len(paths)}'
          for p in paths:
              assert p.is_file()
          with tarfile.open('interleave-gfx906-isa.tar.gz', 'w:gz', compresslevel=5) as archive:
              for p in paths:
                  archive.add(p, arcname='interleave/' + p.name)
          print('ISA files:', len(paths))
          print('Archive size:', Path('interleave-gfx906-isa.tar.gz').stat().st_size)
          PY

      - name: Upload saved ISA and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfx906-fattn-dot2-interleave
          path: |
            interleave-gfx906-isa.tar.gz
            interleave-build.log
          retention-days: 10
          if-no-files-found: warn
