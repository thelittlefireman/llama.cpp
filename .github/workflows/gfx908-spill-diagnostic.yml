name: gfx908 Q4 FATTN barrier count diagnostic

on:
  push:
    branches: [test-vsub4-vs-specialized]
    paths:
      - .github/workflows/gfx908-spill-diagnostic.yml

permissions:
  contents: read

jobs:
  gfx908:
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:7.2.1
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: de8c93244911cc8a5465540a8425500058dd10ea
          path: src-group1
          fetch-depth: 1

      - name: Create barrier variants
        shell: bash
        run: |
          set -euxo pipefail
          cp -a src-group1 src-nobarrier
          cp -a src-group1 src-group2
          cp -a src-group1 src-group4
          python3 - <<'PY'
          from pathlib import Path

          def q4_body(path):
              p = Path(path)
              s = p.read_text()
              begin = s.index("static __device__ __forceinline__ void dequantize_V_q4_0")
              end = s.index("static __device__ __forceinline__ void dequantize_V_q4_1", begin)
              return p, s, begin, end, s[begin:end]

          p, s, begin, end, body = q4_body("src-nobarrier/ggml/src/ggml-cuda/fattn-common.cuh")
          lines = body.splitlines()
          i = next(i for i, line in enumerate(lines) if "__builtin_amdgcn_sched_group_barrier" in line)
          assert lines[i - 3].strip() == "#if defined(GGML_USE_HIP)"
          assert lines[i + 1].strip() == "#endif // defined(GGML_USE_HIP)"
          del lines[i - 3:i + 2]
          p.write_text(s[:begin] + chr(10).join(lines) + chr(10) + s[end:])

          for count in (2, 4):
              p, s, begin, end, body = q4_body(f"src-group{count}/ggml/src/ggml-cuda/fattn-common.cuh")
              old = "__builtin_amdgcn_sched_group_barrier(0x20, 1, 0);"
              new = f"__builtin_amdgcn_sched_group_barrier(0x20, {count}, 0);"
              assert body.count(old) == 1
              body = body.replace(old, new)
              p.write_text(s[:begin] + body + s[end:])
          PY

      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git cmake rocblas-dev hipblas-dev libssl-dev python3 ninja-build

      - name: Build variants
        shell: bash
        run: |
          set -euxo pipefail
          for variant in nobarrier group1 group2 group4; do
            cmake -S "src-$variant" -B "build-$variant" -G Ninja \
              -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
              -DGPU_TARGETS=gfx908 \
              -DGGML_HIP=ON \
              -DGGML_HIP_EXPORT_METRICS=On \
              -DCMAKE_BUILD_TYPE=Release \
              -DGGML_BUILD_TESTS=OFF \
              -DGGML_BUILD_EXAMPLES=OFF \
              -DGGML_BUILD_SERVER=OFF
            target="$(ninja -C "build-$variant" -t targets all | sed -n 's/:.*//p' | grep 'fattn-vec-instance-q4_0-q4_0.*[.]o$' | head -n1)"
            test -n "$target"
            ninja -C "build-$variant" "$target" -j2 2>&1 | tee "$variant.log"
          done

      - name: Summarize Q4 FATTN resources
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          sig = re.compile(r"flash_attn_ext_vecILi(\d+)ELi(\d+)EL9ggml_type2ELS0_2ELb([01])EE")
          fields = {
              "vgpr": re.compile(r"VGPRs: (\d+)"),
              "agpr": re.compile(r"AGPRs: (\d+)"),
              "scratch": re.compile(r"ScratchSize \[bytes/lane\]: (\d+)"),
              "occ": re.compile(r"Occupancy \[waves/SIMD\]: (\d+)"),
              "vgpr_spill": re.compile(r"VGPRs Spill: (\d+)"),
          }

          print("RESULT,variant,D,ncols,softcap,vgpr,agpr,occupancy,scratch,vgpr_spill")
          for variant in ("nobarrier", "group1", "group2", "group4"):
              lines = Path(f"{variant}.log").read_text(errors="replace").splitlines()
              found = 0
              for i, line in enumerate(lines):
                  m = sig.search(line)
                  if not (m and "Function Name:" in line):
                      continue
                  block = "\n".join(lines[i + 1:i + 10])
                  vals = {}
                  for name, rx in fields.items():
                      fm = rx.search(block)
                      vals[name] = int(fm.group(1)) if fm else -1
                  print(f"RESULT,{variant},{m.group(1)},{m.group(2)},{m.group(3)},{vals['vgpr']},{vals['agpr']},{vals['occ']},{vals['scratch']},{vals['vgpr_spill']}")
                  found += 1
              if found != 12:
                  raise SystemExit(f"{variant}: expected 12 specializations, found {found}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: gfx908-q4-barrier-counts
          path: |
            *.log
            build-nobarrier/**/*.s
            build-group1/**/*.s
            build-group2/**/*.s
            build-group4/**/*.s
          compression-level: 0
          retention-days: 3
