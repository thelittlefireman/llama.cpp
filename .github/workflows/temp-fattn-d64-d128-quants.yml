name: Temporary fattn D64 D128 quant test

on:
  push:
    branches:
      - feature_change_to_warp_size64
    paths:
      - .github/workflows/temp-fattn-d64-d128-quants.yml
      - .github/temp-fattn-d64-d128.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature_change_to_warp_size64
          fetch-depth: 0
      - name: Apply policy rollback and add tests
        run: python3 .github/temp-fattn-d64-d128.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/temp-fattn-d64-d128.py .github/workflows/temp-fattn-d64-d128-quants.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ggml/src/ggml-cuda/fattn.cu ggml/src/ggml-cuda/fattn-vec.cuh tests/test-backend-ops.cpp
          git commit -m 'hip: characterize GCN fattn vec across D and quants'
          git push origin HEAD:feature_change_to_warp_size64
