name: gfx906 sparse tile ISA and VGPR diagnostics

on:
  push:
    branches: [test_GCN_SPARSE_FATTN_GFX906_SPILLS]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vgpr:
    strategy:
      fail-fast: false
      matrix:
        variant: [checked-only, unchecked-only, offset32, v-loop, v-outer-loop]
    name: gfx906 ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:7.2.1
    steps:
      - uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake ninja-build rocblas-dev hipblas-dev libssl-dev python3

      - name: Apply diagnostic variant
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import os
          import pathlib

          path = pathlib.Path("ggml/src/ggml-cuda/fattn-tile.cuh")
          original = path.read_text()
          text = original
          variant = os.environ["VARIANT"]
          if variant in ("checked-only", "unchecked-only"):
              marker = "    if (ncols2 == 1 || use_sparse) {"
              assert text.count(marker) == 1
              checked = "true" if variant == "checked-only" else "false"
              branch = """    if constexpr (use_sparse) {
                  for (int k_VKQ_0 = blockIdx.y*nbatch_fa; k_VKQ_0 < k_VKQ_max; k_VKQ_0 += gridDim.y*nbatch_fa) {
                      constexpr bool oob_check = CHECKED;
                      flash_attn_tile_iter<warp_size, nwarps, ncols1, ncols2, DKQ, DV, nbatch_fa, nbatch_K, use_logit_softcap, oob_check, use_sparse>
                          (Q_tmp, K_h2, V_h2, maskh, sparse_indices, ne01, logit_softcap, slope, KQ, KV_tmp,
                          stride_K2, stride_V2, stride_mask, KQ_max, KQ_sum, VKQ, k_VKQ_0, k_VKQ_max, col_Q_0);
                  }
              } else if (ncols2 == 1) {""".replace("CHECKED", checked)
              text = text.replace(marker, branch)
          elif variant == "offset32":
              marker = "(use_sparse ? int64_t(i_KV_offset)*stride_KV : i_KV_offset*stride_KV)"
              assert text.count(marker) == 2
              text = text.replace(marker, "(i_KV_offset*stride_KV)")
          elif variant == "v-loop":
              marker = "#pragma unroll\n        for (int k1 = 0; k1 < nbatch_V; k1 += np) {"
              assert text.count(marker) == 2
              text = text.replace(marker, "#pragma unroll 1\n        for (int k1 = 0; k1 < nbatch_V; k1 += np) {")
          elif variant == "v-outer-loop":
              marker = "#pragma unroll\n    for (int k0 = 0; k0 < nbatch_fa; k0 += nbatch_V) {"
              assert text.count(marker) == 1
              text = text.replace(marker, "#pragma unroll 1\n    for (int k0 = 0; k0 < nbatch_fa; k0 += nbatch_V) {")
          else:
              raise ValueError(variant)
          assert text != original
          patch = "".join(difflib.unified_diff(original.splitlines(keepends=True), text.splitlines(keepends=True), fromfile=str(path), tofile=str(path)))
          pathlib.Path("variant.patch").write_text(patch)
          print(patch)
          path.write_text(text)
          PY

      - name: Configure gfx906
        shell: bash
        run: |
          set -euo pipefail
          "$(hipconfig -l)/clang" --version
          cmake -B build -S . -G Ninja \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DGPU_TARGETS=gfx906 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DGGML_HIP=ON \
            -DGGML_HIP_EXPORT_METRICS=ON \
            -DGGML_CCACHE=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile tile kernels
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(ninja -C build -t targets all | awk -F': ' '$1 ~ /\/fattn-tile-instance-dkq(128|256|320|512|576)-dv[0-9]+\.cu\.o$/ {print $1}')
          test "${#targets[@]}" -gt 0
          printf '%s\n' "${targets[@]}"
          ninja -C build -j 1 "${targets[@]}" 2>&1 | tee metrics.log

      - name: Report tile VGPR usage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee tile-vgpr.tsv
          import re
          import runpy
          import sys

          parse_log = runpy.run_path("scripts/hip/gcn-cdna-vgpr-check.py")["parse_log_file"]
          functions = parse_log("metrics.log")
          pattern = re.compile(r"flash_attn_tileILi(\d+)ELi(\d+)ELi(\d+)ELi(\d+)ELb([01])ELb([01])EE")
          rows = {}
          for name, data in functions.items():
              match = pattern.search(name)
              if match:
                  rows[tuple(map(int, match.groups()))] = (data["vgprs"], data["spill"])
          print("DKQ\tDV\tncols1\tncols2\tsoftcap\tsparse\tVGPR\tSpills\tTotal")
          for key, (vgpr, spill) in sorted(rows.items()):
              print(*key, vgpr, spill, vgpr + spill, sep="\t")
          sparse = [key for key in rows if key[-1] == 1]
          if not sparse or any(rows[key][0] == 0 for key in sparse):
              sys.exit("Missing sparse kernel resource metrics")
          PY

      - name: Export ISA and register allocation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import shlex
          import subprocess

          out = pathlib.Path("diagnostics").resolve()
          metrics = pathlib.Path("metrics.log").read_text()
          pattern = re.compile(r"Function Name: (\S*flash_attn_tileILi(\d+)ELi(\d+)ELi1ELi\d+ELb0ELb[01]EE\S*)")
          names = {}
          for name, dkq, dv in pattern.findall(metrics):
              names.setdefault((int(dkq), int(dv)), set()).add(name)

          commands = json.loads(pathlib.Path("build/compile_commands.json").read_text())
          wanted = {(128, 128), (256, 256), (320, 256), (512, 512), (576, 512)}
          done = set()
          for entry in commands:
              src = pathlib.Path(entry["file"])
              match = re.fullmatch(r"fattn-tile-instance-dkq(\d+)-dv(\d+)\.cu", src.name)
              if not match:
                  continue
              key = tuple(map(int, match.groups()))
              if key not in wanted:
                  continue
              assert key in names, f"No kernel names for {key}"
              cmd = entry.get("arguments") or shlex.split(entry["command"])
              args = []
              i = 0
              while i < len(cmd):
                  arg = cmd[i]
                  if arg in ("-o", "-MF", "-MT", "-MQ"):
                      i += 2
                      continue
                  if arg not in ("-c", "-MD", "-MMD", "-MP"):
                      args.append(arg)
                  i += 1
              stem = out / src.stem
              asm = stem.with_suffix(".s")
              args += ["--offload-device-only", "-S", "-o", str(asm),
                       "-mllvm", "-filter-print-funcs=" + ",".join(sorted(names[key])),
                       "-mllvm", "-print-before=greedy", "-mllvm", "-print-after=greedy",
                       "-mllvm", "-print-after=virtregrewriter"]
              stem.with_suffix(".command.txt").write_text(shlex.join(args) + "\n")
              print(f"Exporting {src.name}", flush=True)
              log = stem.with_suffix(".regalloc.log")
              with log.open("w") as handle:
                  result = subprocess.run(args, cwd=entry["directory"], stdout=handle, stderr=subprocess.STDOUT)
              if result.returncode:
                  print("\n".join(log.read_text(errors="replace").splitlines()[-30:]), flush=True)
                  result.check_returncode()
              assert asm.stat().st_size > 0, f"Empty ISA for {src.name}"
              assert "Greedy Register Allocator" in log.read_text(errors="replace"), f"No greedy allocator dump for {src.name}"
              done.add(key)
          assert done == wanted, f"Missing translation units: {wanted - done}"
          PY
          cp build/compile_commands.json diagnostics/
          du -h diagnostics/*

      - name: Check major VGPR spills
        continue-on-error: true
        run: python3 scripts/hip/gcn-cdna-vgpr-check.py metrics.log

      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfx906-tile-isa-vgpr-${{ matrix.variant }}
          path: |
            metrics.log
            tile-vgpr.tsv
            variant.patch
            diagnostics/
